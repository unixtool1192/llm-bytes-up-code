[project]
name = "llm-bytes-up-code"
version = "0.1.0"
description = "Companion code for the course 'LLMs from the Bytes Up': open a real model file and read every number the lessons quote"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "gguf>=0.17",
    "tokenizers>=0.21",
    "psutil>=7.2.2",
    "threadpoolctl>=3.7.0",
]

[project.scripts]
llmbytes = "llmbytes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmbytes"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
